name: Bootstrap 0.22.7

on:
  push:
    branches: [master]
    paths: ['.github/workflows/bootstrap-0.22.7.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Validate release state
        run: |
          grep -q '^### 0.22.7 (2026-09-30)$' CHANGELOG.md
          git fetch --tags --force
          if git rev-parse 'refs/tags/0.22.7' >/dev/null 2>&1; then
            echo 'Tag already exists: 0.22.7' >&2
            exit 1
          fi

      - name: Create tag 0.22.7
        run: |
          git tag 0.22.7
          git push origin refs/tags/0.22.7
