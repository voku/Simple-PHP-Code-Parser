name: Agent Map Issue 8 Consumer Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/agent-map-8-replay
    paths:
      - '.github/workflows/agent-map-issue-8-replay.yml'

permissions:
  contents: read

jobs:
  frozen-issue-101-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout replay harness
        uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false

      - name: Checkout frozen pre-fix target
        uses: actions/checkout@v7
        with:
          repository: voku/Simple-PHP-Code-Parser
          ref: 53f1b5085ee883560afa9326ee914f6b23acd6ae
          path: target
          persist-credentials: false

      - name: Checkout pinned agent-loop control
        uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: 206cfdb3199740d85f342699e34a19744c554ef5
          path: toolchain/agent-loop
          persist-credentials: false

      - name: Checkout pinned Recall candidate
        uses: actions/checkout@v7
        with:
          repository: voku/agent-recall-compiler
          ref: 5a2710970e68e41c96a7c5d015f573fd4ec1d289
          path: candidate/agent-recall-compiler
          persist-credentials: false

      - name: Checkout agent-map issue 8 candidate
        uses: actions/checkout@v7
        with:
          repository: voku/agent-map
          ref: 62c90034775f7dbc14696caccc156b0c51bb8ea3
          path: candidate/agent-map
          persist-credentials: false

      - name: Checkout pinned L2 skill catalog
        uses: actions/checkout@v7
        with:
          repository: voku/agent-skills
          ref: c7e9d8bdda59d957600bca8dc9f787f03286b277
          path: skills
          persist-credentials: false

      - name: Setup PHP 8.5 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate frozen provenance and one-variable candidate
        run: |
          set -euo pipefail
          issue='harness/tools/agent-loop/dogfood/issue-101.json'
          test "$(jq -r '.target_base_commit' "${issue}")" = "$(git -C target rev-parse HEAD)"
          test "$(jq -r '.toolchain.agent_loop_commit' "${issue}")" = "$(git -C toolchain/agent-loop rev-parse HEAD)"
          test "$(jq -r '.toolchain.agent_recall_compiler_candidate_commit' "${issue}")" = "$(git -C candidate/agent-recall-compiler rev-parse HEAD)"
          test "$(jq -r '.toolchain.agent_skills_commit' "${issue}")" = "$(git -C skills rev-parse HEAD)"
          test "$(git -C candidate/agent-map rev-parse HEAD)" = '62c90034775f7dbc14696caccc156b0c51bb8ea3'

      - name: Install exact toolchain with only agent-map varied
        run: |
          set -euo pipefail
          php -r '
          $path = "harness/tools/agent-loop/composer.json";
          $data = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [
              [
                  "type" => "path",
                  "url" => "../../../toolchain/agent-loop",
                  "options" => ["symlink" => false, "versions" => ["voku/agent-loop" => "dev-main"]],
              ],
              [
                  "type" => "path",
                  "url" => "../../../candidate/agent-recall-compiler",
                  "options" => ["symlink" => false, "versions" => ["voku/agent-recall-compiler" => "0.11.99"]],
              ],
              [
                  "type" => "path",
                  "url" => "../../../candidate/agent-map",
                  "options" => ["symlink" => false, "versions" => ["voku/agent-map" => "0.7.99"]],
              ],
          ];
          $data["require-dev"]["voku/agent-recall-compiler"] = "0.11.99";
          $data["require-dev"]["voku/agent-map"] = "0.7.99";
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
          composer update --working-dir=harness/tools/agent-loop --no-interaction --prefer-dist --no-progress
          composer update --working-dir=target --no-interaction --prefer-dist --no-progress
          test "$(composer show --working-dir=harness/tools/agent-loop voku/agent-map --format=json | jq -r '.versions[0]')" = '0.7.99'

      - name: Replay frozen raw map evidence with root-relative artifacts
        run: |
          set -euo pipefail
          out='target/.agent-loop/dogfood/agent-map-8'
          mkdir -p "${out}" 'target/.agent-loop/map'
          loop='harness/tools/agent-loop/vendor/bin'

          "${loop}/agent-map" build \
            --root=target \
            --paths=src,tests \
            --out=.agent-loop/map/php-symbols.json
          "${loop}/agent-map" search-index build \
            --root=target \
            --index=.agent-loop/map/php-symbols.json \
            --database=.agent-loop/map/search.sqlite

          test -f target/.agent-loop/map/php-symbols.json
          test -f target/.agent-loop/map/search.sqlite
          test ! -e target/target/.agent-loop/map/php-symbols.json
          test ! -e target/target/.agent-loop/map/search.sqlite

          query="$(jq -r '.issue | .title + "\n\n" + .body' harness/tools/agent-loop/dogfood/issue-101.json)"
          "${loop}/agent-map" search "${query}" \
            --root=target \
            --index=.agent-loop/map/php-symbols.json \
            --database=.agent-loop/map/search.sqlite \
            --limit=15 \
            --format=json > "${out}/map-search.json"

          jq -e '.results | length == 15' "${out}/map-search.json" >/dev/null
          jq -e '.results[4].file_path | endswith("PhpCodeParser.php")' "${out}/map-search.json" >/dev/null
          jq -e '.results[7].symbol_id | endswith("PHPProperty::readObjectFromPhpNode")' "${out}/map-search.json" >/dev/null
          jq -e '[.results[].file_path | endswith("PHPClass.php")] | any | not' "${out}/map-search.json" >/dev/null

      - name: Prove governed context still expands the frozen raw miss structurally
        working-directory: target
        run: |
          set -euo pipefail
          loop='../harness/tools/agent-loop/vendor/bin/agent-loop'
          skills='../skills/skills/operational-prompting/operating-prompts.json'
          issue='../harness/tools/agent-loop/dogfood/issue-101.json'
          query="$(jq -r '.issue | .title + "\n\n" + .body' "${issue}")"

          "${loop}" init scaffold
          mkdir -p .agent-loop/tasks .agent-loop/dogfood/agent-map-8
          printf '# GH-101\n\n%s\n' "${query}" > .agent-loop/tasks/GH-101.md
          "${loop}" board card create GH-101 \
            --title='PHP 8.5 reflection and null-array-key regression' \
            --lane=READY \
            --status=Selected
          "${loop}" workflow plan GH-101 \
            --by agent-map-8-replay \
            --file tests/ReflectionTypeFormattingRegressionTest.php \
            --file src/voku/SimplePhpParser/Parsers/PhpCodeParser.php \
            --goal 'Reproduce and minimally fix the two PHP 8.5 regressions without changing established type semantics.' \
            --non-goal 'Do not redesign the parser or change unrelated PHP-version behavior.' \
            --validation 'vendor/bin/phpunit tests/ReflectionTypeFormattingRegressionTest.php' \
            --tag reflection \
            --tag php85 \
            --operating-prompt-manifest "${skills}" \
            --operating-prompt '{"id":"reproduce-before-fix","arguments":{}}'
          "${loop}" workflow approve GH-101 --by agent-map-8-replay
          "${loop}" workflow context GH-101 > .agent-loop/dogfood/agent-map-8/workflow-context.txt

          grep -F 'PHPClass.php:31-139' .agent-loop/dogfood/agent-map-8/workflow-context.txt >/dev/null
          grep -F 'direct caller that may need adaptation' .agent-loop/dogfood/agent-map-8/workflow-context.txt >/dev/null

      - name: Archive replay evidence
        if: always()
        run: |
          set -euo pipefail
          out='target/.agent-loop/dogfood/agent-map-8'
          git -C target rev-parse HEAD > "${out}/target-commit.txt"
          git -C toolchain/agent-loop rev-parse HEAD > "${out}/agent-loop-commit.txt"
          git -C candidate/agent-recall-compiler rev-parse HEAD > "${out}/recall-commit.txt"
          git -C candidate/agent-map rev-parse HEAD > "${out}/agent-map-candidate-commit.txt"
          git -C skills rev-parse HEAD > "${out}/skills-commit.txt"
          cp harness/tools/agent-loop/composer.lock "${out}/tool-composer.lock" 2>/dev/null || true
          composer show --working-dir=harness/tools/agent-loop --format=json > "${out}/tool-packages.json" 2>/dev/null || true

      - name: Upload frozen replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-map-8-issue-101-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            target/.agent-loop/dogfood/agent-map-8
            target/.agent-loop/map/php-symbols.json
            target/.agent-loop/contracts/GH-101
            target/.agent-loop/runs/GH-101
