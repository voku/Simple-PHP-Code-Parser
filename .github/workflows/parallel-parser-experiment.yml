name: Parallel parser experiment

on:
  pull_request:
    branches:
      - master
    paths:
      - 'tools/parallel-parser-experiment.php'
      - 'tools/parallel-parser-stage2-experiment.php'
      - '.github/workflows/parallel-parser-experiment.yml'
      - 'src/**'
      - 'composer.json'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pcntl, zip
          tools: composer

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run bounded parallel parser proof
        run: php tools/parallel-parser-experiment.php

      - name: Run parallel raw-AST boundary proof
        run: php tools/parallel-parser-stage2-experiment.php

      - name: Summarize result
        if: always() && hashFiles('build/parallel-parser-experiment.json') != ''
        run: |
          {
            echo '## Parallel parser experiment'
            echo
            echo '| Case | Files | Workers | Equal | Sequential median | Parallel median | Speedup |'
            echo '|---|---:|---:|:---:|---:|---:|---:|'
            jq -r '.cases | to_entries[] | "| \(.key) | \(.value.files) | \(.value.workers) | \(.value.equal) | \(.value.sequential_median_ms) ms | \(.value.parallel_median_ms) ms | \(.value.speedup)x |"' build/parallel-parser-experiment.json
            echo
            echo 'First semantic differences:'
            jq -c '.cases | to_entries[] | select(.value.first_diff != null) | {case: .key, first_diff: .value.first_diff}' build/parallel-parser-experiment.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize stage2 result
        if: always() && hashFiles('build/parallel-parser-stage2-experiment.json') != ''
        run: |
          {
            echo '## Parallel parser stage2 experiment'
            echo
            echo '| Case | Files | Workers | Equal | Sequential median | Parallel median | Speedup |'
            echo '|---|---:|---:|:---:|---:|---:|---:|'
            jq -r '.cases | to_entries[] | "| \(.key) | \(.value.files) | \(.value.workers) | \(.value.equal) | \(.value.sequential_median_ms) ms | \(.value.parallel_median_ms) ms | \(.value.speedup)x |"' build/parallel-parser-stage2-experiment.json
            echo
            echo 'First semantic differences:'
            jq -c '.cases | to_entries[] | select(.value.first_diff != null) | {case: .key, first_diff: .value.first_diff}' build/parallel-parser-stage2-experiment.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment report
        if: always() && hashFiles('build/parallel-parser-experiment.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallel-parser-experiment
          path: |
            build/parallel-parser-experiment.json
            build/parallel-parser-stage2-experiment.json
