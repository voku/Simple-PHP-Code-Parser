on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  runtime-dependency-floor:
    name: runtime dependency floor (php-parser 4.18.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - name: Install locked runtime floor dependencies
        working-directory: tools/runtime-floor
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Smoke public parser API
        working-directory: tools/runtime-floor
        run: |
          test "$(composer show nikic/php-parser --format=json | php -r '$d=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo $d["versions"][0];')" = "v4.18.0"
          php <<'PHP'
          <?php

          declare(strict_types=1);

          require __DIR__ . '/vendor/autoload.php';

          use PhpParser\Node\Stmt\Class_;
          use PhpParser\Node\Stmt\Namespace_;
          use voku\SimplePhpParser\Parsers\PhpCodeParser;

          $ast = PhpCodeParser::getAstFromString(<<<'CODE'
          <?php
          namespace FloorProof;
          class Example {}
          CODE);

          if (count($ast) !== 1 || !$ast[0] instanceof Namespace_) {
              throw new RuntimeException('Expected one namespace node.');
          }

          $namespace = $ast[0];
          if ((string) $namespace->name !== 'FloorProof') {
              throw new RuntimeException('Expected resolved FloorProof namespace.');
          }

          $class = $namespace->stmts[0] ?? null;
          if (!$class instanceof Class_ || $class->namespacedName === null) {
              throw new RuntimeException('Expected resolved class name.');
          }

          if ((string) $class->namespacedName !== 'FloorProof\\Example') {
              throw new RuntimeException('Unexpected resolved class name: ' . (string) $class->namespacedName);
          }
          PHP

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [
            8.1,
            8.2,
            8.3,
            8.4,
            8.5
        ]
        composer: [basic]
        # Test against both supported nikic/php-parser major versions.
        # php-parser v4 requires phpunit ^9.6 because phpunit/php-code-coverage v11+
        # has a hard dependency on php-parser v5; phpunit 9 uses php-code-coverage v9
        # which is compatible with both.
        parser-version: [v4, v5]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == 8.5 && matrix.parser-version == 'v5' && 'xdebug' || 'none' }}
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          # Include parser-version in the key to avoid cache poisoning between v4/v5 runs.
          key: ${{ matrix.php }}-${{ matrix.parser-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-${{ matrix.parser-version }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.parser-version }}" == "v4" ]]; then
            # php-parser v4: pin phpunit to ^9.6 because phpunit 11's php-code-coverage requires php-parser v5.
            # Use --with (temporary constraint) instead of listing packages positionally: the latter is a
            # partial-update and requires a lock file, which libraries do not commit. --with does a full
            # resolve with the extra constraint, so it works fine without a lock file.
            composer update --prefer-dist --no-interaction --with nikic/php-parser:'^4.18' --with phpunit/phpunit:'^9.6'
          elif [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          else
            composer update --prefer-dist --no-interaction
          fi

          composer dump-autoload -o

      - name: Run tests
        run: |
          if [[ "${{ matrix.php }}" == "8.5" && "${{ matrix.parser-version }}" == "v5" ]]; then
            mkdir -p build/logs
            php vendor/bin/phpunit -c phpunit.xml --coverage-filter=src --coverage-clover=build/logs/clover.xml
          else
            php vendor/bin/phpunit -c phpunit.xml
          fi

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' }}
        run: |
          php vendor/bin/phpstan analyse

      - name: Upload coverage results to Coveralls
        if: ${{ matrix.php == 8.5 && matrix.parser-version == 'v5' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          coverage-reporter-version: v0.6.22

      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs_composer-${{ matrix.composer }}_parser-${{ matrix.parser-version }}_php-${{ matrix.php }}
          path: |
            build/logs

