name: Create release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer tag, e.g. 0.22.9'
        required: true
        type: string
      expected_sha:
        description: 'Exact master commit SHA that was validated for release'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate release authority
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $VERSION" >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character commit SHA: $EXPECTED_SHA" >&2
            exit 1
          fi

          git fetch origin master --tags --force
          MASTER_SHA="$(git rev-parse origin/master)"
          if [[ "$MASTER_SHA" != "$EXPECTED_SHA" ]]; then
            echo "master moved: expected $EXPECTED_SHA, current $MASTER_SHA" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Checkout mismatch for release candidate $EXPECTED_SHA" >&2
            exit 1
          fi

          if ! grep -Eq "^### $VERSION \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $VERSION" >&2
            exit 1
          fi

          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $VERSION" >&2
            exit 1
          fi

      - name: Verify exact release candidate CI
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESSFUL_RUNS="$(gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&event=push&status=success&per_page=1"             --jq '.total_count')"

          if [[ "$SUCCESSFUL_RUNS" -lt 1 ]]; then
            echo "No successful master push CI run found for $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git tag "$VERSION" "$EXPECTED_SHA"
          git push origin "refs/tags/$VERSION"
